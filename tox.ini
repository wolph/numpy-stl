[tox]
requires =
    tox-uv>=1.0
    tox-gh-actions>=3.0
env_list =
    py{310,311,312,313}-numpy{1,2}
    speedups
    lint
    pyrefly
    docs
    docs-examples
    coverage
skip_missing_interpreters = true

[gh-actions]
python =
    3.10: py310
    3.11: py311
    3.12: py312
    3.13: py313

# ── Test matrix ──────────────────────────────────────────────

[testenv]
description = Run tests under {basepython} with {envname}
deps =
    .[tests]
    numpy1: numpy>=1.24,<2
    numpy2: numpy>=2,<3
commands =
    pytest --basetemp={envtmpdir}/tmp --cov-report= {posargs}
set_env =
    COVERAGE_FILE = {toxworkdir}/.coverage.{envname}

# py313 + numpy1 is not supported
[testenv:py313-numpy1]
deps =
commands = python -c "print('SKIP: numpy 1.x does not support Python 3.13')"

# ── Speedups ────────────────────────────────────────────────

[testenv:speedups]
description = Run tests with the speedups C extension
basepython = python3.13
deps =
    .[tests]
    .[fast]
    numpy>=2,<3
commands =
    pytest --basetemp={envtmpdir}/tmp --cov-report= {posargs}
set_env =
    COVERAGE_FILE = {toxworkdir}/.coverage.speedups

# ── Lint ─────────────────────────────────────────────────────

[testenv:lint]
description = Lint with ruff
skip_install = true
deps = ruff>=0.15.0
commands =
    ruff check stl tests
    ruff format --check stl tests

# ── Type checking ────────────────────────────────────────────

[testenv:pyrefly]
description = Type-check with pyrefly
deps =
    .
    pyrefly>=0.1
commands =
    pyrefly check

[testenv:ty]
description = Type-check with ty (run explicitly: tox -e ty)
deps =
    .
    ty
commands =
    ty check stl

# ── Docs ─────────────────────────────────────────────────────

[testenv:docs]
description = Build Sphinx documentation
deps = .[docs]
changedir = docs
commands =
    sphinx-build -b html -d {envtmpdir}/doctrees . {envtmpdir}/html

[testenv:docs-examples]
description = Run README and docs code samples in sandboxes
deps =
    .[tests,docs]
    matplotlib>=3.8
set_env =
    NUMPY_STL_RUN_DOCS_EXAMPLES = 1
commands =
    pytest --basetemp={envtmpdir}/tmp tests/docs_examples

# ── Coverage ─────────────────────────────────────────────────

[testenv:coverage]
description = Combine coverage from test envs and enforce threshold
skip_install = true
deps = coverage>=7.0
depends =
    py{310,311,312,313}-numpy{1,2}
    speedups
set_env =
    COVERAGE_FILE = {toxworkdir}/.coverage
commands =
    coverage combine {toxworkdir}
    coverage report --fail-under=100
